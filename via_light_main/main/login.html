<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Via Light</title>
    <link rel="stylesheet" href="style.css">
	<link rel="icon" type="image/x-icon" href="assets/images/melonLogo.png">
</head>
<body>
	<header> 
		<a href="index.html">
			<div class="containerLT">
				<img src="assets/images/shopping.png">
				<h1 style="color: var(--text4);">Via <span style="color: var(--text3);">Light</span></h1>
			</div>
		</a>
		<a href="login.html">
			<h1 class="clickHeader">
				Login
			</h1>
		</a>
	</header>
	<!-- MAIN -->
	<div id="interfaceLogin">
		<div class="interfaceLogin">
			<form class="loginForm">
				<h1>Bem-vindo devolta!</h1>            
				<h2>Por-favor, entre em sua conta para continuar.</h2>
				<label for="usuario">E-mail:</label>
				<input placeholder="Email@Email.com" type="text" id="txtusuario" name="usuario" required>
				<label for="senha">Senha:</label>
				<input placeholder="●●●●●●" type="text" id="txtsenha" name="senha" required>
				<button type="button" onclick="ValidarLogin()">Entrar</button>
			</form>
			<figure class="imagemTelaLogin">
				<img src="assets/images/imagemLogin.png">
			</figure>
		</div>
	</div>
	<!-- FOOTER -->
