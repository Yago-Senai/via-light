    <meta charset="UTF-8">

<body>
    <header> 
		<div class="containerLT">
			<a href="index.html"><h1 style="color: var(--text1);">Via <span style="color: #3885ab;">Light</span></h1></a>
		</div>
		<a href="login.html">
			<button  id="botaoHeader">
				Login
			</button>
		</a>
	</header>
    <div id="interface">
		<form action="conexaocadfuncionarios.php" method="post" onsubmit="return validarForm()" class="formCad">
			<h1>Cadastro de Funcionários</h1>
			<label for="txtidfuncionario">Id Funcionário</label>
			<input type="number" name="idfuncionario" id="txtidfuncionario" required>
			<label for="txtnome">Nome</label>
			<input type="text" name="nome" id="txtnome" required>
			<label for="txtemail">Email</label>
			<input type="email" name="email" id="txtemail" required>
			<label for="txttelefone">Telefone</label>
			<input type="number" name="telefone" id="txttelefone" required>
			<label for="txtturno">Turno</label>
			<input type="text" name="turno" id="txtturno" required>
			<label for="txtdtcargo">Cargo</label>
			<input type="text" name="dtcargo" id="txtdtcargo" required>
			<label for="txtsetor">Setor</label>
			<input type="text" name="setor" id="txtsetor" required>
			<label for="txtendereco">Endereco</label>
			<input type="text" name="endereco" id="txtendereco" required>
			<label for="txtdtnascimento">Data de Nascimento</label>
			<input type="date" name="dtnascimento" id="txtdtnascimento" required>
            <button type="submit" name="acao" value="cadastrar">Cadastrar</button>
			<button type="submit" name="acao" value="atualizar">Atualizar</button>
			<button type="submit" name="acao" value="excluir" onclick="return confirm('Tem certeza que deseja excluir?')">Excluir</button>
        </form>
    </div>
